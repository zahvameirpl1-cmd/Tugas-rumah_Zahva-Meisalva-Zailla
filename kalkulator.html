<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Nilai - Zahva Meisalva Zailla</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f9f4;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* Navbar */
        nav {
            background-color: #1a365d;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav h1 {
            font-size: 1.2rem;
            font-weight: bold;
        }
        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }
        nav ul li a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.9rem;
        }
        /* Main Content Container */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        /* Card Layout */
        .card {
            background: white;
            width: 100%;
            max-width: 700px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card h2 {
            color: #1a365d;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        .card p.deskripsi {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        /* Form Inputs */
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 50%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-size: 0.9rem;
            outline: none;
        }
        /* Button */
        button {
            background-color: #e11d48;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }
        button:hover {
            background-color: #be123c;
        }
        /* Result */
        #hasil {
            font-size: 0.9rem;
            color: #334155;
        }
        /* Footer */
        footer {
            background-color: #1a365d;
            color: #cbd5e1;
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            line-height: 1.6;
        }
        footer a {
            color: #cbd5e1;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Navbar Atas -->
    <nav>
        <h1>Zahva Meisalva Zailla</h1>
        <ul>
            <li><a href="index.html">Beranda</a></li>
            <li><a href="proyek.html">Proyek</a></li>
            <li><a href="kontak.html">Kontak</a></li>
        </ul>
    </nav>

    <!-- Konten Utama (Kartu) -->
    <main>
        <div class="card">
            <h2>Kalkulator Nilai</h2>
            <p class="deskripsi">Masukkan nilai tugas, UTS, dan UAS, lalu tekan tombol Hitung.</p>
            
            <div class="input-group">
                <label for="tugas">Nilai tugas</label>
                <input type="number" id="tugas" min="0" max="100">
            </div>
            
            <div class="input-group">
                <label for="uts">Nilai UTS</label>
                <input type="number" id="uts" min="0" max="100">
            </div>
            
            <div class="input-group">
                <label for="uas">Nilai UAS</label>
                <input type="number" id="uas" min="0" max="100">
            </div>

            <button id="btnHitung">Hitung</button>

            <p id="hasil"></p>
        </div>
    </main>

    <!-- Footer Bawah -->
    <footer>
        <p>Kontak: <a href="mailto:ZahvaMei.rpl1@gmail.com">ZahvaMei.rpl@gmail.com</a> | <a href="#">GitHub</a> | <a href="#">YouTube</a></p>
        <p>© 2026 Zahva Meisalva Zailla. Dibuat dengan semangat sambil belajar di Kelas Industri UBIG.</p>
    </footer>

    <script src="js/kalkulator.js"></script>
</body>
</html>
